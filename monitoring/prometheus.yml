global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "avi-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
  - job_name: "safety-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - safety-service:8001
  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets:
          - qdrant:6333
