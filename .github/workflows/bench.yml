name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "Pytest marker expression to run"
        required: false
        default: "not smoke"
  schedule:
    - cron: "0 3 * * 1"

jobs:
  run-benchmarks:
    name: Integration & performance suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      PYTEST_MARKER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.marker || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/ml-cpu.txt
            requirements.dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/ml-cpu.txt
          pip install -r requirements.dev.txt

      - name: Run pytest benchmarks
        run: |
          if [ -z "$PYTEST_MARKER" ]; then
            pytest --maxfail=1 --disable-warnings
          else
            pytest -m "$PYTEST_MARKER" --maxfail=1 --disable-warnings
          fi
