name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e ".[dev,test]"

      - name: Run pre-commit

        run: pre-commit run --all-files

      - name: Run mypy
        continue-on-error: true
        run: mypy --config-file pyproject.toml

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
          AVI_TEST_MODE: "1"
          REQUIRE_API_KEY: "false"
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term --ignore=tests/e2e --ignore=tests/performance

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docker-images:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image namespace
        id: image-namespace
        run: |
          echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.image-namespace.outputs.owner }}/avi-api
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Docker metadata (Safety Service)
        id: meta-safety
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.image-namespace.outputs.owner }}/avi-safety-service
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Safety Service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: safety_service/Dockerfile
          push: true
          tags: ${{ steps.meta-safety.outputs.tags }}
          labels: ${{ steps.meta-safety.outputs.labels }}

      - name: Log in to Docker Hub (optional)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push API image to Docker Hub (optional)
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_REPOSITORY }}/avi-api:${{ github.ref_name }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Push Safety Service image to Docker Hub (optional)
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: safety_service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_REPOSITORY }}/avi-safety-service:${{ github.ref_name }}
          labels: ${{ steps.meta-safety.outputs.labels }}
